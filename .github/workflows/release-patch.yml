name: Release patch
on:
  workflow_dispatch:
    inputs:
      initial_release:
        description: Publish current base as the first stable release (no increment)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: texpro-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_release-stable.yml
    with:
      bump: ${{ inputs.initial_release && 'initial' || 'patch' }}
    secrets: inherit
