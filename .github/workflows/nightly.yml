name: Nightly

on:
  schedule:
    # 03:17 UTC — 11:17 Asia/Shanghai. Deliberately off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    name: Check today's changes (Asia/Shanghai)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
      date: ${{ steps.changes.outputs.date }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changes
        run: node scripts/nightly-changes.cjs
      - name: Prepare nightly version
        id: version
        if: steps.changes.outputs.build == 'true'
        env:
          NIGHTLY_DATE: ${{ steps.changes.outputs.date }}
        run: node scripts/set-nightly-version.mjs --dry-run

  test:
    name: Typecheck and build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:regression
      - run: npm run typecheck
      - run: npm run build

  macos:
    name: macOS universal
    needs: [changes, test]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NIGHTLY_DATE: ${{ needs.changes.outputs.date }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-nightly-version.mjs
      - run: npm run build
      - run: npm run verify:release
      - name: Build DMG and ZIP
        run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [changes, test]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NIGHTLY_DATE: ${{ needs.changes.outputs.date }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-nightly-version.mjs
      - run: npm run build
      - run: npm run verify:release
      - name: Build installer, portable and zip
        run: npx electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  linux:
    name: Ubuntu and CentOS packages
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY_DATE: ${{ needs.changes.outputs.date }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm libarchive-tools
      - run: npm ci
      - run: node scripts/set-nightly-version.mjs
      - run: npm run build
      - run: npm run verify:release
      - name: Build AppImage, deb and rpm
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  release:
    name: Publish nightly prerelease
    needs: [changes, macos, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Point today's nightly tag at the built commit
        env:
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: |
          git tag --force "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$NIGHTLY_TAG"
      - name: Publish dated nightly tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changes.outputs.tag }}
          name: ${{ needs.changes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated nightly build of TeXPro.

            - Version: `${{ needs.changes.outputs.tag }}`
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Run: #${{ github.run_number }}
            - macOS: universal DMG/ZIP
            - Windows: NSIS installer, portable EXE, ZIP
            - Ubuntu: deb, AppImage
            - CentOS/RHEL: rpm

            These builds are unsigned and intended for testing.
          files: release/**/*
