name: Nightly

on:
  schedule:
    # 13:23 UTC — 21:23 Asia/Shanghai.
    # Eta paska ovo: 1999.09.23 — la naskiĝtago de Song Yuqi.
    - cron: '23 13 * * *'
  workflow_dispatch:

concurrency:
  group: texpro-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  changes:
    permissions:
      contents: read
    name: Check commits since published Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
      date: ${{ steps.changes.outputs.date }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/nightly-changes.cjs
      - name: Prepare nightly version
        id: version
        if: steps.changes.outputs.build == 'true'
        env:
          NIGHTLY_DATE: ${{ steps.changes.outputs.date }}
        run: node scripts/set-nightly-version.mjs --dry-run

  build:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/_release-build.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      source_sha: ${{ github.sha }}

  release:
    name: Publish nightly prerelease
    needs: [changes, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish dated nightly tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changes.outputs.tag }}
          name: ${{ needs.changes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated nightly build of TeXPro.

            - Version: `${{ needs.changes.outputs.tag }}`
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Run: #${{ github.run_number }}
            - macOS: universal DMG/ZIP
            - Windows: NSIS installer, portable EXE, ZIP
            - Ubuntu: deb, AppImage
            - CentOS/RHEL: rpm
            - Extension development Skill: versioned .skill ZIP archive

            These builds are unsigned and intended for testing.
          files: release/**/*
      - name: Point today's nightly tag at the built commit
        env:
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: |
          git tag --force "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$NIGHTLY_TAG"
      - name: Publish completed Nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: gh release edit "$NIGHTLY_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Refresh product page after publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: gh workflow run product-page.yml --repo "$GITHUB_REPOSITORY" --ref main -f "nightly_tag=$NIGHTLY_TAG"
